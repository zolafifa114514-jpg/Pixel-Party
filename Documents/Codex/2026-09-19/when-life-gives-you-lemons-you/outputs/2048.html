<!doctype html><html lang="en"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>2048 — Pixel Party</title><link rel="stylesheet" href="styles.css"><script src="progress.js"></script></head><body><div class="site-shell"><header class="topbar"><a class="brand" href="index.html"><span class="brand-mark">✦</span> Pixel Party</a><nav><span class="points-chip">✦ <strong data-points>0</strong> pts</span><a class="home-link" href="index.html">← Menu</a></nav></header><main class="main game-main"><section class="game-wrap"><h1 class="game-title">2048</h1><p class="game-subtitle">Use the arrow keys to slide tiles. Combine matching numbers to reach 2048.</p><div class="game-panel"><div class="score-row"><div class="score-box"><small>Score</small><span id="score">0</span></div><div class="score-box"><small>Best</small><span id="best">0</span></div></div><div class="board-2048" id="board"></div><div id="status" class="status">Keep sliding.</div><button class="action-btn" id="restart">New game</button><p class="controls">Arrow keys to move · Swipe works on touch · +1 point per merge</p></div></section></main></div><script>let grid,score=0,best=+localStorage.game2048Best||0;const board=document.getElementById('board');document.getElementById('best').textContent=best;function stat(t){document.getElementById('status').textContent=t}function add(){let e=[];grid.forEach((r,y)=>r.forEach((v,x)=>{if(!v)e.push([x,y])}));if(e.length){let [x,y]=e[Math.floor(Math.random()*e.length)];grid[y][x]=Math.random()<.9?2:4}}function render(){board.innerHTML='';grid.flat().forEach(v=>{let t=document.createElement('div');t.className='tile';t.dataset.value=v||'';t.textContent=v||'';board.append(t)});document.getElementById('score').textContent=score;if(score>best){best=score;localStorage.game2048Best=best;document.getElementById('best').textContent=best}}function start(){grid=Array.from({length:4},()=>Array(4).fill(0));score=0;add();add();render();stat('Keep sliding.')}function canMove(){for(let y=0;y<4;y++)for(let x=0;x<4;x++)if(!grid[y][x]||grid[y][x+1]===grid[y][x]||grid[y+1]?.[x]===grid[y][x])return true;return false}function move(d){let old=JSON.stringify(grid),lines=[];for(let i=0;i<4;i++){let line=d==='left'||d==='right'?grid[i].slice():grid.map(r=>r[i]);if(d==='right'||d==='down')line.reverse();line=line.filter(Boolean);for(let j=0;j<line.length-1;j++)if(line[j]===line[j+1]){line[j]*=2;score+=line[j];PP.add(1);line.splice(j+1,1)}while(line.length<4)line.push(0);if(d==='right'||d==='down')line.reverse();lines.push(line)}for(let i=0;i<4;i++)if(d==='left'||d==='right')grid[i]=lines[i];else grid.forEach((r,j)=>r[i]=lines[j][i]);if(JSON.stringify(grid)!==old){add();render();if(grid.flat().includes(2048))stat('You found 2048! Keep going or start fresh.');else if(!canMove()){PP.add(20);stat('No more moves · +20 completion points!')}}}document.addEventListener('keydown',e=>{let d={'ArrowLeft':'left','ArrowRight':'right','ArrowUp':'up','ArrowDown':'down'}[e.key];if(d){e.preventDefault();move(d)}});let sx,sy;board.addEventListener('touchstart',e=>{sx=e.touches[0].clientX;sy=e.touches[0].clientY},{passive:true});board.addEventListener('touchend',e=>{let dx=e.changedTouches[0].clientX-sx,dy=e.changedTouches[0].clientY-sy;if(Math.max(Math.abs(dx),Math.abs(dy))<25)return;move(Math.abs(dx)>Math.abs(dy)?dx>0?'right':'left':dy>0?'down':'up')},{passive:true});document.getElementById('restart').onclick=start;start();</script></body></html>
