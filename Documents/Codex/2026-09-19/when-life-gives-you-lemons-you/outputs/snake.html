<!doctype html><html lang="en"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Snake — Pixel Party</title><link rel="stylesheet" href="styles.css"><script src="progress.js"></script></head><body><div class="site-shell"><header class="topbar"><a class="brand" href="index.html"><span class="brand-mark">✦</span> Pixel Party</a><nav><span class="points-chip">✦ <strong data-points>0</strong> pts</span><a class="home-link" href="index.html">← Menu</a></nav></header><main class="main game-main"><section class="game-wrap"><h1 class="game-title">Snake</h1><p class="game-subtitle">Use the arrow keys. Eat the dots. Stay away from the walls.</p><div class="game-panel"><div class="score-row"><div class="score-box"><small>Score</small><span id="score">0</span></div><div class="score-box"><small>Best</small><span id="best">0</span></div></div><canvas id="game" width="480" height="480"></canvas><div id="status" class="status">Ready when you are.</div><button class="action-btn" id="restart">Start game</button><p class="controls">Arrow keys to move · Space to pause · +5 points per dot</p></div></section></main></div><script>const c=document.getElementById('game'),x=c.getContext('2d'),N=20,S=c.width/N;let snake,food,dir,next,score,run=false,paused=false,best=+localStorage.snakeBest||0;document.getElementById('best').textContent=best;function stat(t){document.getElementById('status').textContent=t}function place(){do{food={x:Math.floor(Math.random()*N),y:Math.floor(Math.random()*N)}}while(snake.some(p=>p.x===food.x&&p.y===food.y))}function draw(){x.fillStyle='#fbf8ef';x.fillRect(0,0,c.width,c.height);x.fillStyle='#ff6b6b';x.beginPath();x.arc(food.x*S+S/2,food.y*S+S/2,S*.28,0,7);x.fill();snake.forEach((p,i)=>{x.fillStyle=i?'#2d6a4f':'#1b4332';x.beginPath();x.roundRect(p.x*S+3,p.y*S+3,S-6,S-6,7);x.fill()})}function reset(){snake=[{x:10,y:10},{x:9,y:10},{x:8,y:10}];dir={x:1,y:0};next=dir;score=0;run=false;paused=false;place();draw();document.getElementById('score').textContent=0;stat('Ready when you are.');document.getElementById('restart').textContent='Start game'}function tick(){if(!run||paused)return;dir=next;let h={x:snake[0].x+dir.x,y:snake[0].y+dir.y};if(h.x<0||h.x>=N||h.y<0||h.y>=N||snake.some(p=>p.x===h.x&&p.y===h.y)){run=false;PP.add(10);stat('Game over · +10 points for playing!');document.getElementById('restart').textContent='Play again';return}snake.unshift(h);if(h.x===food.x&&h.y===food.y){score++;PP.add(5);document.getElementById('score').textContent=score;if(score>best){best=score;localStorage.snakeBest=best;document.getElementById('best').textContent=best}place()}else snake.pop();draw()}document.addEventListener('keydown',e=>{let k=e.key;if(['ArrowUp','ArrowDown','ArrowLeft','ArrowRight',' '].includes(k))e.preventDefault();if(k===' ')paused=!paused;if(k==='ArrowUp'&&dir.y!==1)next={x:0,y:-1};if(k==='ArrowDown'&&dir.y!==-1)next={x:0,y:1};if(k==='ArrowLeft'&&dir.x!==1)next={x:-1,y:0};if(k==='ArrowRight'&&dir.x!==-1)next={x:1,y:0}});document.getElementById('restart').onclick=()=>{reset();run=true;document.getElementById('restart').textContent='Restart';stat('Go!')};reset();setInterval(tick,115);</script></body></html>
