<!doctype html><html lang="en"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Pong — Pixel Party</title><link rel="stylesheet" href="styles.css"><script src="progress.js"></script></head><body><div class="site-shell"><header class="topbar"><a class="brand" href="index.html"><span class="brand-mark">✦</span> Pixel Party</a><nav><span class="points-chip">✦ <strong data-points>0</strong> pts</span><a class="home-link" href="index.html">← Menu</a></nav></header><main class="main game-main"><section class="game-wrap"><h1 class="game-title">Pong</h1><p class="game-subtitle">Move your paddle and send the ball back. First to 7 wins.</p><div class="game-panel"><div class="score-row"><div class="score-box"><small>You</small><span id="you">0</span></div><div class="score-box"><small>CPU</small><span id="cpu">0</span></div></div><canvas class="pong-canvas" id="pong" width="640" height="400"></canvas><div id="status" class="status">Ready when you are.</div><button class="action-btn" id="start">Start game</button><div class="touch-controls"><button data-move="up">▲ Move up</button><button data-move="down">▼ Move down</button></div><p class="controls">W / S or ↑ / ↓ to move · +15 points per goal · +50 for a win</p></div></section></main></div><script>const c=document.getElementById('pong'),x=c.getContext('2d'),W=c.width,H=c.height;let you=0,cpu=0,py=160,ay=160,b={x:W/2,y:H/2,vx:5,vy:3},run=false,keys={};function stat(t){document.getElementById('status').textContent=t}function resetBall(d){b={x:W/2,y:H/2,vx:d*5,vy:(Math.random()>.5?1:-1)*3}}function draw(){x.fillStyle='#1e2140';x.fillRect(0,0,W,H);x.strokeStyle='rgba(255,255,255,.18)';x.setLineDash([8,15]);x.beginPath();x.moveTo(W/2,0);x.lineTo(W/2,H);x.stroke();x.setLineDash([]);x.fillStyle='#f7c948';x.fillRect(22,py,12,80);x.fillStyle='#ff6b6b';x.fillRect(W-34,ay,12,80);x.beginPath();x.arc(b.x,b.y,9,0,7);x.fillStyle='#fffaf2';x.fill()}function point(w){if(w==='you'){you++;PP.add(15)}else{cpu++;PP.add(5)}document.getElementById(w).textContent=w==='you'?you:cpu;if(you===7||cpu===7){run=false;if(you===7){PP.add(50);stat('You win! +50 bonus points.')}else stat('CPU wins · +5 points for the goal.');document.getElementById('start').textContent='Play again'}else resetBall(w==='you'?1:-1)}function tick(){if(!run)return;if(keys.ArrowUp||keys.w)py-=7;if(keys.ArrowDown||keys.s)py+=7;py=Math.max(0,Math.min(H-80,py));ay+=((b.y-40)-ay)*.075;b.x+=b.vx;b.y+=b.vy;if(b.y<9||b.y>H-9)b.vy*=-1;if(b.x<45&&b.x>25&&b.y>py-8&&b.y<py+88){b.vx=Math.abs(b.vx)*1.04;b.vy+=(b.y-(py+40))*.08}if(b.x>W-45&&b.x<W-25&&b.y>ay-8&&b.y<ay+88){b.vx=-Math.abs(b.vx)*1.04;b.vy+=(b.y-(ay+40))*.08}if(b.x<0)point('cpu');if(b.x>W)point('you');draw();requestAnimationFrame(tick)}document.addEventListener('keydown',e=>keys[e.key]=true);document.addEventListener('keyup',e=>keys[e.key]=false);document.querySelectorAll('[data-move]').forEach(el=>{let k=el.dataset.move==='up'?'ArrowUp':'ArrowDown';el.onpointerdown=()=>keys[k]=true;el.onpointerup=()=>keys[k]=false;el.onpointerleave=()=>keys[k]=false});document.getElementById('start').onclick=()=>{you=cpu=0;document.getElementById('you').textContent=0;document.getElementById('cpu').textContent=0;py=ay=160;resetBall(Math.random()>.5?1:-1);run=true;stat('Game on!');document.getElementById('start').textContent='Restart';requestAnimationFrame(tick)};draw();</script></body></html>
